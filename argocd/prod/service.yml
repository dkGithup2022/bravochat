apiVersion: v1
kind: Service
metadata:
  name: chatbot-bravo
  namespace: chatbot-bravo-prod
  labels:
    app: chatbot-bravo
    environment: production
spec:
  type: ClusterIP
  selector:
    app: chatbot-bravo
  ports:
    # fe만 노출 — be(8080)는 컨테이너 내부에서 fe 프록시로만 접근
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
