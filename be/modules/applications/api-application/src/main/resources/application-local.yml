spring:
  datasource:
    url: jdbc:h2:file:./data/chatbot-bravo-be;AUTO_SERVER=TRUE;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:local_h2/schema.sql
      data-locations: classpath:local_h2/data.sql
  h2:
    console:
      enabled: true
      path: /h2-console
