name: Production Deploy | chatbot-bravo (fe+be single image)

on:
  push:
    branches: prod

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- 검증: fe 빌드/린트 (도커 빌드 실패를 앞단에서 빨리 잡기 위함) ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: FE install
        run: npm ci
        working-directory: fe

      - name: FE build (validation)
        run: npm run build
        working-directory: fe
        env:
          NEXT_PUBLIC_USE_MOCK: "false"

      - name: FE lint
        run: npm run lint
        working-directory: fe

      # --- 검증: be 컴파일 (테스트는 이미지 빌드와 분리해 추후 추가) ---
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: BE bootJar (validation)
        run: ./gradlew :modules:applications:api-application:bootJar --no-daemon
        working-directory: be

      # --- 단일 이미지 빌드 & 푸시 ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bravo-chat-demo:prod
            ${{ secrets.DOCKERHUB_USERNAME }}/bravo-chat-demo:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_USE_MOCK=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
