<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isUser }}" hint-placeholder-val="{{ false }}">
  <div style="width:100%;display:flex;justify-content:flex-end;">
    <div style="max-width:80%;background:#1f2328;color:#fff;font-size:17px;padding:13px 16px;border-radius:16px 4px 16px 16px;line-height:1.5;font-family:-apple-system,'Noto Sans KR',sans-serif;">{{ msg.text }}</div>
  </div>
</sc-if>
<sc-if value="{{ isBot }}" hint-placeholder-val="{{ false }}">
  <div style="width:100%;display:flex;align-items:flex-start;gap:9px;">
    <div style="width:40px;height:40px;flex:none;border-radius:50%;background:#0d1117;overflow:hidden;display:flex;align-items:center;justify-content:center;"><img src="assets/mascot-clear.png" alt="브라보" style="width:38px;height:38px;object-fit:contain;object-position:center;" /></div>
    <div style="max-width:80%;background:#f6f8fa;border:1px solid #d0d7de;color:#1f2328;font-size:17px;padding:13px 16px;border-radius:4px 16px 16px 16px;line-height:1.55;white-space:pre-line;font-family:-apple-system,'Noto Sans KR',sans-serif;">{{ msg.text }}</div>
  </div>
</sc-if>
<sc-if value="{{ isSchedule }}" hint-placeholder-val="{{ false }}">
  <div style="width:100%;display:flex;align-items:flex-start;gap:9px;">
    <div style="width:40px;height:40px;flex:none;border-radius:50%;background:#0d1117;overflow:hidden;display:flex;align-items:center;justify-content:center;"><img src="assets/mascot-clear.png" alt="브라보" style="width:38px;height:38px;object-fit:contain;object-position:center;" /></div>
    <div style="max-width:80%;background:#fff;border:1px solid #d0d7de;border-radius:4px 16px 16px 16px;overflow:hidden;font-family:-apple-system,'Noto Sans KR',sans-serif;">
    <div style="padding:11px 16px;background:#f6f8fa;border-bottom:1px solid #d0d7de;color:#656d76;font-size:14px;font-family:'Space Mono',monospace;">이번주 일정</div>
    <sc-for list="{{ msg.items }}" as="it" hint-placeholder-count="3">
      <div style="display:flex;align-items:center;gap:11px;padding:13px 16px;border-bottom:1px solid #eaecef;color:#1f2328;font-size:16px;">
        <span style="width:18px;height:18px;border:1.8px solid #8b949e;border-radius:6px;flex:none;"></span>
        {{ it }}
      </div>
    </sc-for>
    </div>
  </div>
</sc-if>
<sc-if value="{{ isOptions }}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;flex-wrap:wrap;gap:9px;max-width:92%;">
    <sc-for list="{{ msg.options }}" as="opt" hint-placeholder-count="3">
      <span style="background:#fff;border:1px solid #d0d7de;color:#1f2328;font-size:16px;padding:11px 16px;border-radius:10px;font-weight:600;cursor:pointer;font-family:-apple-system,'Noto Sans KR',sans-serif;">{{ opt }}</span>
    </sc-for>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:80},&quot;msg&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ who: string; text?: string; options?: string[] }&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const w = this.props.msg?.who;
    return {
      msg: this.props.msg,
      isUser: w === "user",
      isBot: w === "bot",
      isSchedule: w === "schedule",
      isOptions: w === "options",
    };
  }
}
</script>
</body>
</html>
