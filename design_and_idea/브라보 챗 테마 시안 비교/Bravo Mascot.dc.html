<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-10px) rotate(.6deg); } }
  @keyframes glow { 0%,100% { opacity:.55; } 50% { opacity:1; } }
</style>
</helmet>
<div style="min-height:100vh;background:#000;display:flex;align-items:center;justify-content:center;gap:60px;flex-wrap:wrap;padding:60px 40px;font-family:'Space Mono',monospace;">

  <div style="display:flex;flex-direction:column;align-items:center;gap:20px;">
    <div style="animation:float 5s ease-in-out infinite;">
      <svg width="380" height="480" viewBox="0 0 460 600" fill="none" stroke="#1a6dff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <!-- EAR -->
        <path d="M388 62 L396 176 L322 150 Z"/>
        <path d="M388 62 L322 150 L300 158 L306 128 Z"/>
        <path d="M396 176 L322 150 L300 158 L296 182 L332 214 L372 196 Z"/>
        <!-- HEAD TOP / CROWN -->
        <path d="M300 158 L296 182 L150 182 L138 150 L210 138 Z"/>
        <path d="M296 182 L150 182 L108 236 L258 226 L266 202 Z"/>
        <path d="M296 182 L266 202 L332 214 Z"/>
        <!-- BACK PLATE with disc -->
        <path d="M372 196 L332 214 L258 226 L266 288 L360 300 L372 256 Z"/>
        <!-- FOREHEAD LEFT -->
        <path d="M150 182 L108 236 L92 300 L104 356 L200 340 L258 226 Z"/>
        <!-- side disc (cheek) -->
        <circle cx="322" cy="288" r="44"/>
        <circle cx="322" cy="288" r="24"/>
        <!-- CHEEK / lower head right -->
        <path d="M266 288 L200 340 L228 430 L300 420 L360 300 Z"/>
        <!-- SNOUT top -->
        <path d="M104 356 L200 340 L228 430 L150 440 L96 416 Z"/>
        <!-- SNOUT front / muzzle -->
        <path d="M96 416 L150 440 L146 470 L74 452 L72 384 Z"/>
        <!-- mouth cut -->
        <path d="M78 388 L136 382 L146 404 L82 416 Z"/>
        <!-- NECK / COLLAR -->
        <path d="M228 430 L300 420 L360 300"/>
        <path d="M150 440 L146 470 L166 512 L352 500 L364 452 L300 420 L228 430 Z"/>
        <path d="M166 512 L156 556 L340 566 L352 500 Z"/>
        <!-- glowing eye -->
        <circle cx="322" cy="288" r="10" fill="#1a6dff" stroke="none" style="animation:glow 2.4s ease-in-out infinite;"/>
      </svg>
    </div>
    <div style="color:#1a6dff;font-size:14px;letter-spacing:3px;">BRAVO · v1</div>
  </div>

</div>
</x-dc>
</body>
</html>
