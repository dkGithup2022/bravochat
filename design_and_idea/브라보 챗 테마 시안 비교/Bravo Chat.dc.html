<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: #1f2328; }
  a:hover { color: #0969da; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes earA { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-6deg); } }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
  @keyframes typing { 0%,60%,100% { opacity: .25; transform: translateY(0);} 30% { opacity: 1; transform: translateY(-3px);} }
</style>
</helmet>
<div style="min-height:100vh;background:#e8e9ec;display:flex;align-items:center;justify-content:center;padding:48px 24px;font-family:-apple-system,'Noto Sans KR',sans-serif;">
  <div style="width:560px;height:1150px;background:#1a1d24;border-radius:60px;padding:16px;box-shadow:0 40px 80px -24px rgba(20,22,28,.5);border:1px solid #30363d;">
    <div style="width:100%;height:100%;border-radius:46px;background:#ffffff;overflow:hidden;display:flex;flex-direction:column;position:relative;">

      <div style="display:flex;justify-content:space-between;align-items:center;padding:20px 30px 4px;color:#8b949e;font-size:15px;font-family:'Space Mono',monospace;">9:41<span style="letter-spacing:1px;">브라보</span></div>

      <!-- mascot -->
      <div style="display:flex;flex-direction:column;align-items:center;padding:14px 0 4px;">
        <img src="assets/mascot-clear.png" alt="브라보" style="height:150px;width:auto;display:block;animation:bob 4s ease-in-out infinite;" />
      </div>

      <!-- widgets 2x2 : icon + text one line -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 24px 6px;">
        <button onClick="{{ pick }}" data-label="이번주 일정 보여줘" style="cursor:pointer;background:#fff;border:1px solid #d0d7de;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-family:inherit;" style-hover="background:#f6f8fa;border-color:#1f2328;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
          <span style="font-size:16px;font-weight:700;color:#1f2328;flex:1;">이번주 일정</span>
          <span style="font-size:13px;color:#656d76;font-family:'Space Mono',monospace;white-space:nowrap;">남은 2개</span>
        </button>
        <button onClick="{{ pick }}" data-label="일상 기록 보여줘" style="cursor:pointer;background:#fff;border:1px solid #d0d7de;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-family:inherit;" style-hover="background:#f6f8fa;border-color:#1f2328;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h5"/></svg>
          <span style="font-size:16px;font-weight:700;color:#1f2328;flex:1;">일상 기록</span>
          <span style="font-size:13px;color:#656d76;font-family:'Space Mono',monospace;white-space:nowrap;">3개 요약</span>
        </button>
        <button onClick="{{ pick }}" data-label="위젯 1" style="cursor:pointer;background:#fff;border:1px solid #d0d7de;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-family:inherit;" style-hover="background:#f6f8fa;border-color:#1f2328;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3" stroke-dasharray="3 3"/></svg>
          <span style="font-size:16px;font-weight:700;color:#8b949e;">위젯 1</span>
        </button>
        <button onClick="{{ pick }}" data-label="위젯 2" style="cursor:pointer;background:#fff;border:1px solid #d0d7de;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-family:inherit;" style-hover="background:#f6f8fa;border-color:#1f2328;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3" stroke-dasharray="3 3"/></svg>
          <span style="font-size:16px;font-weight:700;color:#8b949e;">위젯 2</span>
        </button>
      </div>

      <!-- chat -->
      <div ref="{{ scrollRef }}" style="flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:13px;">
        <sc-for list="{{ messages }}" as="m" hint-placeholder-count="3">
          <dc-import name="Bravo Message" msg="{{ m }}" hint-size="100%,60px"></dc-import>
        </sc-for>
        <sc-if value="{{ pending }}" hint-placeholder-val="{{ false }}">
          <div style="align-self:flex-start;display:flex;gap:5px;background:#f6f8fa;border:1px solid #d0d7de;border-radius:4px 16px 16px 16px;padding:16px 18px;">
            <i style="width:7px;height:7px;border-radius:50%;background:#8b949e;animation:typing 1.2s infinite;"></i><i style="width:7px;height:7px;border-radius:50%;background:#8b949e;animation:typing 1.2s infinite .2s;"></i><i style="width:7px;height:7px;border-radius:50%;background:#8b949e;animation:typing 1.2s infinite .4s;"></i>
          </div>
        </sc-if>
      </div>

      <!-- input -->
      <div style="padding:14px 24px 26px;display:flex;gap:10px;align-items:center;border-top:1px solid #eaecef;background:#fff;">
        <input value="{{ draft }}" onInput="{{ onDraft }}" onKeyDown="{{ onKey }}" placeholder="메시지 입력…" style="flex:1;background:#f6f8fa;border:1px solid #d0d7de;border-radius:14px;padding:15px 20px;color:#1f2328;font-size:16px;outline:none;font-family:inherit;" />
        <button onClick="{{ send }}" style="width:56px;height:56px;border:none;border-radius:14px;background:#1f2328;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4"/></svg>
        </button>
      </div>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    draft: "",
    pending: false,
    messages: [
      { id: 1, who: "user", text: "이번주 일정 말해줄래?" },
      { id: 2, who: "schedule", items: ["공과금 내기", "주말 가족 모임", "이마트 다녀오기"] },
      { id: 3, who: "user", text: "이마트는 다녀왔어" },
      { id: 4, who: "bot", text: "알겠습니다. 잘 다녀오셨나요?\n기록으로 남길 것이 있나요?" },
      { id: 5, who: "user", text: "아니 별거 없어." },
      { id: 6, who: "bot", text: "알겠습니다. 다음 도움이 필요하면 말씀해 주세요.\n다음 모임 이전에 알림을 보내드릴까요?" },
    ],
  };
  scrollRef = React.createRef();
  scrollDown() {
    requestAnimationFrame(() => {
      const el = this.scrollRef.current;
      if (el) el.scrollTop = el.scrollHeight;
    });
  }
  push(msg) {
    this.setState(s => ({ messages: [...s.messages, { id: Date.now() + Math.random(), ...msg }] }), () => this.scrollDown());
  }
  sendText(text) {
    if (!text.trim()) return;
    this.push({ who: "user", text });
    this.setState({ draft: "", pending: true }, () => this.scrollDown());
  }
  renderVals() {
    return {
      messages: this.state.messages,
      pending: this.state.pending,
      draft: this.state.draft,
      scrollRef: this.scrollRef,
      onDraft: e => this.setState({ draft: e.target.value }),
      onKey: e => { if (e.key === "Enter") this.sendText(this.state.draft); },
      send: () => this.sendText(this.state.draft),
      pick: e => this.sendText(e.currentTarget.getAttribute("data-label")),
    };
  }
}
</script>
</body>
</html>
